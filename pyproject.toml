[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rexagents"
dynamic = ["version"]
description = "Open Claude Code sessions as native Rex panes, with Program Status Protocol reporting"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
rexagents = "rexagents.__main__:cli"

[tool.setuptools.dynamic]
version = {attr = "rexagents.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
